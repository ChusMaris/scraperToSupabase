<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federation Importer</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        width: 340px;
        padding: 16px;
        background: #111827;
        color: #f3f4f6;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        color: #cbd5e1;
      }
      input, select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #1f2937;
        color: #f9fafb;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 18px;
        color: #93c5fd;
      }
      .log-list {
        max-height: 150px;
        overflow-y: auto;
        margin: 10px 0 0;
        padding: 8px 8px 8px 28px;
        border: 1px solid #374151;
        border-radius: 6px;
        background: #0b1220;
        font-size: 11px;
        line-height: 1.4;
        color: #cbd5e1;
      }
      .log-list li + li {
        margin-top: 4px;
      }
      .log-list li[data-level="error"] {
        color: #fca5a5;
      }
      .log-list li[data-level="success"] {
        color: #86efac;
      }
    </style>
  </head>
  <body>
    <h3>Importar partido</h3>

    <label>
      Temporada
      <select id="temporada">
        <option value="">Cargando temporadas...</option>
      </select>
      <input id="temporada-new" class="custom-value" type="text" placeholder="Escribe otra temporada" hidden />
    </label>

    <label>
      Categoría
      <select id="categoria">
        <option value="">Cargando categorías...</option>
      </select>
      <input id="categoria-new" class="custom-value" type="text" placeholder="Escribe otra categoría" hidden />
    </label>

    <label>
      Competición
      <select id="competicion">
        <option value="">Cargando competiciones...</option>
      </select>
      <input id="competicion-new" class="custom-value" type="text" placeholder="Escribe otra competición" hidden />
    </label>

    <label>
      Jornada
      <select id="jornada">
        <option value="">Selecciona jornada</option>
      </select>
      <input id="jornada-new" class="custom-value" type="number" min="1" placeholder="Escribe otra jornada" hidden />
    </label>

    <button id="importBtn">Importar datos</button>
    <div id="status" class="status">Listo.</div>
    <ol id="import-log" class="log-list" role="log" aria-live="polite" aria-label="Registro de importación"></ol>

    <script src="popup.js"></script>
  </body>
</html>
