<!DOCTYPE html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Federation Importer</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        width: 340px;
        padding: 16px;
        background: #111827;
        color: #f3f4f6;
      }
      h3 {
        margin: 0 0 12px;
        font-size: 18px;
      }
      label {
        display: block;
        margin-top: 10px;
        font-size: 12px;
        color: #cbd5e1;
      }
      input, select {
        width: 100%;
        box-sizing: border-box;
        margin-top: 6px;
        padding: 8px 10px;
        border-radius: 6px;
        border: 1px solid #374151;
        background: #1f2937;
        color: #f9fafb;
      }
      button {
        width: 100%;
        margin-top: 16px;
        padding: 10px;
        border: none;
        border-radius: 8px;
        background: #2563eb;
        color: white;
        font-weight: 700;
        cursor: pointer;
      }
      .status {
        margin-top: 12px;
        font-size: 12px;
        min-height: 18px;
        color: #93c5fd;
      }
    </style>
  </head>
  <body>
    <h3>Importar partido</h3>

    <label>
      Temporada
      <input id="temporada" type="text" list="temporada-options" placeholder="Selecciona o escribe una temporada" autocomplete="off" />
      <datalist id="temporada-options"></datalist>
    </label>

    <label>
      Categoría
      <input id="categoria" type="text" list="categoria-options" placeholder="Selecciona o escribe una categoría" autocomplete="off" />
      <datalist id="categoria-options"></datalist>
    </label>

    <label>
      Competición
      <input id="competicion" type="text" list="competicion-options" placeholder="Selecciona o escribe una competición" autocomplete="off" />
      <datalist id="competicion-options"></datalist>
    </label>

    <label>
      Jornada
      <input id="jornada" type="number" min="1" list="jornada-options" placeholder="Selecciona o escribe una jornada" />
      <datalist id="jornada-options"></datalist>
    </label>

    <button id="importBtn">Importar datos</button>
    <div id="status" class="status">Listo.</div>

    <script src="popup.js"></script>
  </body>
</html>
